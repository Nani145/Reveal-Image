<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGEND REVEAL | ULTIMATE</title>
    <style>
        :root { --cyan: #00f2ff; --pink: #ff0055; --bg: #000000; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #ui { 
            background: rgba(5, 5, 5, 0.95); padding: 15px; border-bottom: 1px solid var(--cyan); 
            z-index: 100; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
            backdrop-filter: blur(20px); position: relative;
        }

        #fs-btn {
            position: absolute; top: 12px; right: 15px;
            background: transparent; color: var(--cyan); border: 1px solid var(--cyan);
            padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        #fs-btn:hover { background: var(--cyan); color: #000; }

        .btn { 
            background: rgba(255, 255, 255, 0.03); color: var(--cyan); border: 1px solid var(--cyan); 
            padding: 10px 20px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 11px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }
        
        input[type="number"] { 
            background: #111; border: 1px solid #333; color: var(--cyan); 
            padding: 10px; width: 130px; border-radius: 10px; text-align: center; font-size: 15px; outline: none;
        }
        input[type="number"]:focus { border-color: var(--cyan); }

        #container { position: relative; flex-grow: 1; width: 100vw; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        #legend { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; z-index: 1; }
        canvas { position: absolute; z-index: 2; pointer-events: none; }
        #fxCanvas { z-index: 3; }

        /* CRT Scanline effect */
        #container::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%);
            z-index: 10; pointer-events: none; background-size: 100% 3px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button id="fs-btn" onclick="toggleFS()">Fullscreen</button>
        <label class="btn" for="file-input">Load Identity</label>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        
        <input type="number" id="reveal-num" placeholder="FOLLOWER COUNT">
        <button class="btn" onclick="executeReveal()">Execute</button>
        <button class="btn" onclick="resetSystem()" style="border-color:var(--pink); color:var(--pink);">Reset System</button>
    </div>

    <div id="container">
        <img id="legend" src="">
        <canvas id="revealCanvas"></canvas>
        <canvas id="fxCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('revealCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        const img = document.getElementById('legend');
        
        let blocks = [];
        let totalRevealed = 0; 
        const cols = 160;
        const rows = 156;
        let blockW, blockH;
        let isAnimating = false;

        function setupCanvas() {
            if (!img.complete || img.naturalWidth === 0) return;
            
            const rect = img.getBoundingClientRect();
            // High DPI Scaling
            const dpr = window.devicePixelRatio || 1;
            
            [canvas, fxCanvas].forEach(c => {
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
                c.style.width = `${rect.width}px`;
                c.style.height = `${rect.height}px`;
            });

            ctx.scale(dpr, dpr);
            fxCtx.scale(dpr, dpr);
            
            blockW = rect.width / cols;
            blockH = rect.height / rows;
            
            renderCurrentState(rect.width, rect.height);
        }

        function renderCurrentState(w, h) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            
            if (totalRevealed > 0) {
                ctx.globalCompositeOperation = 'destination-out';
                for (let i = 0; i < totalRevealed; i++) {
                    if(blocks[i]) ctx.fillRect(blocks[i].x, blocks[i].y, blockW + 0.8, blockH + 0.8);
                }
            }
        }

        function generateBlockList() {
            blocks = [];
            const rect = img.getBoundingClientRect();
            let bW = rect.width / cols;
            let bH = rect.height / rows;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    blocks.push({ x: c * bW, y: r * bH });
                }
            }
            // Shuffle
            for (let i = blocks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
            }
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.src = event.target.result;
                    img.onload = () => {
                        totalRevealed = 0;
                        generateBlockList();
                        setupCanvas();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        function executeReveal() {
            if (isAnimating) return;
            const targetInput = parseInt(document.getElementById('reveal-num').value);
            const maxBlocks = blocks.length;
            const finalTarget = Math.min(targetInput, maxBlocks);
            
            const numToRevealNow = finalTarget - totalRevealed;
            if (numToRevealNow <= 0) return; 

            isAnimating = true;
            const toErase = blocks.slice(totalRevealed, finalTarget);
            let index = 0;
            const batchSize = Math.ceil(numToRevealNow / 45); 

            function animate() {
                const end = Math.min(index + batchSize, toErase.length);
                
                ctx.globalCompositeOperation = 'destination-out';
                for (let i = index; i < end; i++) {
                    const b = toErase[i];
                    ctx.fillRect(b.x, b.y, blockW + 0.9, blockH + 0.9);
                    
                    fxCtx.fillStyle = Math.random() > 0.5 ? '#00f2ff' : '#ff0055';
                    fxCtx.fillRect(b.x, b.y, blockW, blockH);
                }

                index = end;
                
                // Sharp flash trail
                fxCtx.globalCompositeOperation = 'destination-out';
                fxCtx.fillStyle = 'rgba(0,0,0,0.2)';
                fxCtx.fillRect(0, 0, canvas.width, canvas.height);
                fxCtx.globalCompositeOperation = 'source-over';

                if (index < toErase.length) {
                    requestAnimationFrame(animate);
                } else {
                    totalRevealed = finalTarget; 
                    isAnimating = false;
                    fxCtx.clearRect(0,0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        function resetSystem() {
            isAnimating = false;
            totalRevealed = 0;
            document.getElementById('reveal-num').value = "";
            setupCanvas();
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.addEventListener('resize', setupCanvas);
    </script>
</body>
</html>
