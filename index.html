<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGEND REVEAL | MASTERPIECE</title>
    <style>
        :root { --accent: #ffffff; --bg: #000000; --reset-red: #ff3b3b; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #ui { 
            background: rgba(10, 10, 10, 0.98); padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            z-index: 100; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
            backdrop-filter: blur(20px); position: relative;
        }

        .btn { 
            background: #ffffff; color: #000; border: none; 
            padding: 12px 30px; border-radius: 100px;
            font-weight: 800; cursor: pointer; font-size: 11px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        .btn:hover { box-shadow: 0 0 25px rgba(255, 255, 255, 0.7); transform: translateY(-1px); }

        .btn-reset {
            background: transparent; color: var(--reset-red); border: 1px solid var(--reset-red);
            padding: 12px 30px; border-radius: 100px; font-weight: 800; cursor: pointer; font-size: 11px;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-reset:hover { background: var(--reset-red); color: #fff; box-shadow: 0 0 15px var(--reset-red); }

        #fs-btn {
            position: absolute; top: 15px; right: 20px;
            background: transparent; color: #fff; border: 1px solid #fff;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        #fs-btn:hover { box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
        #fs-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        input[type="number"] { 
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 12px; width: 140px; border-radius: 100px; text-align: center; font-size: 15px; outline: none;
        }

        #container { position: relative; flex-grow: 1; width: 100vw; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #legend { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; z-index: 1; }
        canvas { position: absolute; z-index: 2; pointer-events: none; }
        #fxCanvas { z-index: 3; mix-blend-mode: screen; }

        #container::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%);
            z-index: 10; pointer-events: none; background-size: 100% 2px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button id="fs-btn" onclick="toggleFS()">
            <svg id="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        
        <label class="btn" for="file-input" style="display:inline-block; line-height:11px;">Load Identity</label>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        
        <input type="number" id="reveal-num" placeholder="00000">
        <button class="btn" onclick="executeReveal()">Execute</button>
        <button class="btn-reset" onclick="resetSystem()">Reset System</button>
    </div>

    <div id="container">
        <img id="legend" src="">
        <canvas id="revealCanvas"></canvas>
        <canvas id="fxCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('revealCanvas');
        const ctx = canvas.getContext('2d');
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        const img = document.getElementById('legend');
        const fsBtn = document.getElementById('fs-btn');
        
        let blocks = [];
        let totalRevealed = 0; 
        const cols = 160;
        const rows = 156;
        let blockW, blockH;
        let isAnimating = false;

        function setupCanvas() {
            if (!img.complete || img.naturalWidth === 0) return;
            const rect = img.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            [canvas, fxCanvas].forEach(c => {
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
                c.style.width = `${rect.width}px`;
                c.style.height = `${rect.height}px`;
            });

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            blockW = rect.width / cols;
            blockH = rect.height / rows;
            renderMask(rect.width, rect.height);
        }

        function renderMask(w, h) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            if (totalRevealed > 0) {
                ctx.globalCompositeOperation = 'destination-out';
                for (let i = 0; i < totalRevealed; i++) {
                    // Aggressive 2.0px overlap for Fullscreen stability
                    ctx.fillRect(blocks[i].x - 1, blocks[i].y - 1, blockW + 2.0, blockH + 2.0);
                }
            }
        }

        function generateBlocks() {
            blocks = [];
            const rect = img.getBoundingClientRect();
            let bW = rect.width / cols;
            let bH = rect.height / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    blocks.push({ x: c * bW, y: r * bH });
                }
            }
            for (let i = blocks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
            }
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    img.onload = () => { totalRevealed = 0; generateBlocks(); setupCanvas(); };
                };
                reader.readAsDataURL(file);
            }
        });

        function executeReveal() {
            if (isAnimating) return;
            const target = parseInt(document.getElementById('reveal-num').value);
            const finalTarget = Math.min(target, blocks.length);
            const toReveal = finalTarget - totalRevealed;
            if (toReveal <= 0) return;

            isAnimating = true;
            let currentIdx = 0;
            const revealList = blocks.slice(totalRevealed, finalTarget);
            const batch = Math.ceil(toReveal / 45); 

            function animate() {
                const end = Math.min(currentIdx + batch, revealList.length);
                fxCtx.shadowBlur = 20;
                fxCtx.shadowColor = '#ffffff';
                fxCtx.fillStyle = '#ffffff';

                ctx.globalCompositeOperation = 'destination-out';
                for (let i = currentIdx; i < end; i++) {
                    const b = revealList[i];
                    ctx.fillRect(b.x - 1, b.y - 1, blockW + 2.0, blockH + 2.0);
                    fxCtx.fillRect(b.x, b.y, blockW, blockH);
                }

                currentIdx = end;
                
                // Continuous fade
                fxCtx.shadowBlur = 0;
                fxCtx.globalCompositeOperation = 'destination-out';
                fxCtx.fillStyle = 'rgba(0,0,0,0.18)'; 
                fxCtx.fillRect(0, 0, canvas.width, canvas.height);
                fxCtx.globalCompositeOperation = 'source-over';

                if (currentIdx < revealList.length) {
                    requestAnimationFrame(animate);
                } else {
                    totalRevealed = finalTarget;
                    // Final Smooth Fade Out
                    finalFade();
                }
            }
            animate();
        }

        function finalFade() {
            let fadeFrames = 0;
            function fadeOut() {
                fxCtx.globalCompositeOperation = 'destination-out';
                fxCtx.fillStyle = 'rgba(0,0,0,0.1)';
                fxCtx.fillRect(0, 0, canvas.width, canvas.height);
                fadeFrames++;
                
                if (fadeFrames < 20) {
                    requestAnimationFrame(fadeOut);
                } else {
                    isAnimating = false;
                    fxCtx.clearRect(0,0, canvas.width, canvas.height);
                }
            }
            fadeOut();
        }

        function resetSystem() {
            isAnimating = false;
            totalRevealed = 0;
            document.getElementById('reveal-num').value = "";
            setupCanvas();
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>`;
            } else {
                fsBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>`;
            }
        });

        window.addEventListener('resize', () => { setTimeout(setupCanvas, 100); });
    </script>
</body>
</html>
