<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGEND REVEAL SYSTEM v2.0</title>
    <style>
        :root { 
            --cyan: #00f2ff; 
            --pink: #ff0055;
            --bg: #020202; 
        }
        body { background: var(--bg); color: #fff; font-family: 'Inter', 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* SLEEK GLASS UI */
        #ui { 
            background: rgba(10, 10, 10, 0.9); 
            padding: 20px; 
            border-bottom: 1px solid rgba(0, 242, 255, 0.2); 
            z-index: 100; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            backdrop-filter: blur(15px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .btn { 
            background: rgba(255, 255, 255, 0.05); 
            color: var(--cyan); 
            border: 1px solid var(--cyan); 
            padding: 12px 24px; 
            border-radius: 50px; /* Fully rounded sleek boxes */
            font-weight: 700; 
            cursor: pointer; 
            font-size: 12px;
            transition: 0.3s all ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .btn:active { background: var(--cyan); color: #000; box-shadow: 0 0 25px var(--cyan); transform: scale(0.95); }
        
        input[type="number"] { 
            background: rgba(255,255,255,0.08); 
            border: 1px solid rgba(0, 242, 255, 0.3); 
            color: #fff; 
            padding: 12px; 
            width: 140px; 
            border-radius: 15px; 
            text-align: center;
            outline: none;
            font-size: 16px;
        }

        #file-input { display: none; }

        /* REVEAL AREA */
        #container { position: relative; flex-grow: 1; width: 100vw; display: flex; justify-content: center; align-items: center; background: #000; }
        #legend { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; z-index: 1; opacity: 0.9; }
        
        /* THE GRID */
        #grid { 
            position: absolute; width: 100%; height: 100%; z-index: 3;
            display: grid; 
            grid-template-columns: repeat(160, 1fr); 
            grid-template-rows: repeat(156, 1fr); 
        }
        .box { background: #000; border: 0.1px solid #0a0a0a; transition: opacity 0.6s ease; }
        
        /* GLOW EFFECT ON REVEAL */
        .revealed { 
            opacity: 0; 
            pointer-events: none; 
            animation: glowPop 0.8s ease-out forwards; 
        }

        @keyframes glowPop {
            0% { background: var(--cyan); opacity: 1; box-shadow: 0 0 20px var(--cyan); transform: scale(1.2); }
            40% { background: var(--pink); opacity: 0.8; box-shadow: 0 0 40px var(--pink); }
            100% { background: transparent; opacity: 0; transform: scale(1); }
        }

        /* SCANLINE OVERLAY */
        #container::after {
            content: " ";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 4; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <label class="btn" for="file-input">Load Identity</label>
        <input type="file" id="file-input" accept="image/*">
        
        <input type="number" id="reveal-num" placeholder="FOLLOWER COUNT">
        <button class="btn" onclick="executeReveal()">Execute</button>
        <button class="btn" onclick="resetGrid()" style="border-color:var(--pink); color:var(--pink);">Reset System</button>
    </div>

    <div id="container">
        <img id="legend" src="">
        <div id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const img = document.getElementById('legend');
        const fileInput = document.getElementById('file-input');
        const boxes = [];
        const totalBoxes = 24960;

        function initGrid() {
            grid.innerHTML = '';
            boxes.length = 0;
            for (let i = 0; i < totalBoxes; i++) {
                const b = document.createElement('div');
                b.className = 'box';
                grid.appendChild(b);
                boxes.push(b);
            }
            // Shuffle
            for (let i = boxes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boxes[i], boxes[j]] = [boxes[j], boxes[i]];
            }
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    img.src = event.target.result;
                    resetGrid();
                }
                reader.readAsDataURL(file);
            }
        });

        function executeReveal() {
            const val = document.getElementById('reveal-num').value;
            const numToReveal = parseInt(val);
            if (isNaN(numToReveal)) return;
            let count = 0;
            for (let i = 0; i < boxes.length && count < numToReveal; i++) {
                if (!boxes[i].classList.contains('revealed')) {
                    boxes[i].classList.add('revealed');
                    count++;
                }
            }
        }

        function resetGrid() { initGrid(); }
        initGrid();
    </script>
</body>
</html>
