<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGEND REVEAL | WHITE GLOW EDITION</title>
    <style>
        :root { --accent: #ffffff; --bg: #000000; --reset-red: #ff3b3b; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #ui { 
            background: rgba(10, 10, 10, 0.98); padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); 
            z-index: 100; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
            backdrop-filter: blur(20px); position: relative;
        }

        #fs-btn {
            position: absolute; top: 12px; right: 15px;
            background: transparent; color: #888; border: 1px solid #333;
            padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: 800;
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        #fs-btn:hover { border-color: #fff; color: #fff; }

        .btn { 
            background: #ffffff; color: #000; border: none; 
            padding: 10px 24px; border-radius: 4px; font-weight: 800; cursor: pointer; font-size: 11px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: #cccccc; transform: translateY(-1px); }

        .btn-reset {
            background: transparent; color: var(--reset-red); border: 1px solid var(--reset-red);
            padding: 10px 24px; border-radius: 4px; font-weight: 800; cursor: pointer; font-size: 11px;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-reset:hover { background: var(--reset-red); color: #fff; }
        
        input[type="number"] { 
            background: #111; border: 1px solid #333; color: #fff; 
            padding: 10px; width: 140px; border-radius: 4px; text-align: center; font-size: 15px; outline: none;
        }
        input[type="number"]:focus { border-color: #666; }

        #container { position: relative; flex-grow: 1; width: 100vw; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #legend { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; z-index: 1; }
        
        canvas { position: absolute; z-index: 2; pointer-events: none; }
        #fxCanvas { z-index: 3; mix-blend-mode: screen; }

        /* Subtle scanline texture */
        #container::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%);
            z-index: 10; pointer-events: none; background-size: 100% 2px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button id="fs-btn" onclick="toggleFS()">Fullscreen</button>
        <label class="btn" for="file-input">Load Image</label>
        <input type="file" id="file-input" accept="image/*" style="display:none">
        
        <input type="number" id="reveal-num" placeholder="00000">
        <button class="btn" onclick="executeReveal()">Execute Reveal</button>
        <button class="btn-reset" onclick="resetSystem()">Reset System</button>
    </div>

    <div id="container">
        <img id="legend" src="">
        <canvas id="revealCanvas"></canvas>
        <canvas id="fxCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('revealCanvas');
        const ctx = canvas.getContext('2d');
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        const img = document.getElementById('legend');
        
        let blocks = [];
        let totalRevealed = 0; 
        const cols = 160;
        const rows = 156;
        let blockW, blockH;
        let isAnimating = false;

        function setupCanvas() {
            if (!img.complete || img.naturalWidth === 0) return;
            const rect = img.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            [canvas, fxCanvas].forEach(c => {
                c.width = rect.width * dpr;
                c.height = rect.height * dpr;
                c.style.width = `${rect.width}px`;
                c.style.height = `${rect.height}px`;
            });

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            blockW = rect.width / cols;
            blockH = rect.height / rows;
            renderMask(rect.width, rect.height);
        }

        function renderMask(w, h) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);
            
            if (totalRevealed > 0) {
                ctx.globalCompositeOperation = 'destination-out';
                for (let i = 0; i < totalRevealed; i++) {
                    // Over-erase slightly to prevent grid lines
                    ctx.fillRect(blocks[i].x - 0.7, blocks[i].y - 0.7, blockW + 1.5, blockH + 1.5);
                }
            }
        }

        function generateBlocks() {
            blocks = [];
            const rect = img.getBoundingClientRect();
            let bW = rect.width / cols;
            let bH = rect.height / rows;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    blocks.push({ x: c * bW, y: r * bH });
                }
            }
            for (let i = blocks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
            }
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    img.onload = () => { totalRevealed = 0; generateBlocks(); setupCanvas(); };
                };
                reader.readAsDataURL(file);
            }
        });

        function executeReveal() {
            if (isAnimating) return;
            const target = parseInt(document.getElementById('reveal-num').value);
            const finalTarget = Math.min(target, blocks.length);
            const toReveal = finalTarget - totalRevealed;
            if (toReveal <= 0) return;

            isAnimating = true;
            let currentIdx = 0;
            const revealList = blocks.slice(totalRevealed, finalTarget);
            const batch = Math.ceil(toReveal / 45); 

            function animate() {
                const end = Math.min(currentIdx + batch, revealList.length);
                
                // Pure White Glow Configuration
                fxCtx.shadowBlur = 20;
                fxCtx.shadowColor = '#ffffff';
                fxCtx.fillStyle = '#ffffff';

                ctx.globalCompositeOperation = 'destination-out';
                for (let i = currentIdx; i < end; i++) {
                    const b = revealList[i];
                    // HEAVY OVERLAP (+1.5) to kill black lines in fullscreen
                    ctx.fillRect(b.x - 0.7, b.y - 0.7, blockW + 1.5, blockH + 1.5);
                    
                    // FX Sparkle
                    fxCtx.fillRect(b.x, b.y, blockW, blockH);
                }

                currentIdx = end;
                
                // Fade out glow
                fxCtx.shadowBlur = 0;
                fxCtx.globalCompositeOperation = 'destination-out';
                fxCtx.fillStyle = 'rgba(0,0,0,0.25)';
                fxCtx.fillRect(0, 0, canvas.width, canvas.height);
                fxCtx.globalCompositeOperation = 'source-over';

                if (currentIdx < revealList.length) {
                    requestAnimationFrame(animate);
                } else {
                    totalRevealed = finalTarget;
                    isAnimating = false;
                    finishReveal();
                }
            }
            animate();
        }

        function finishReveal() {
            // Final pass ensures absolutely no pixels missed
            ctx.globalCompositeOperation = 'destination-out';
            for (let i = 0; i < totalRevealed; i++) {
                ctx.fillRect(blocks[i].x - 0.7, blocks[i].y - 0.7, blockW + 1.5, blockH + 1.5);
            }
            // Rapid fade clear for FX
            setTimeout(() => fxCtx.clearRect(0,0, canvas.width, canvas.height), 150);
        }

        function resetSystem() {
            isAnimating = false;
            totalRevealed = 0;
            document.getElementById('reveal-num').value = "";
            setupCanvas();
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.addEventListener('resize', () => {
            setTimeout(setupCanvas, 100); // Small delay for browser resize finish
        });
    </script>
</body>
</html>
