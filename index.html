<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGEND SYSTEM v2.0</title>
    <style>
        :root { 
            --cyan: #00f2ff; 
            --purple: #bc13fe;
            --bg: #050505; 
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* SLEEK NEON UI */
        #ui { 
            background: rgba(10, 10, 10, 0.85); 
            padding: 20px; 
            border-bottom: 1px solid rgba(0, 242, 255, 0.3); 
            z-index: 100; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
            backdrop-filter: blur(10px);
        }

        .btn { 
            background: transparent; 
            color: var(--cyan); 
            border: 1px solid var(--cyan); 
            padding: 10px 20px; 
            border-radius: 30px; /* Rounded boxes */
            font-weight: bold; 
            cursor: pointer; 
            font-size: 13px;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
        
        input[type="number"] { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.2); 
            color: #fff; 
            padding: 10px; 
            width: 120px; 
            border-radius: 10px; 
            text-align: center;
            outline: none;
        }

        #file-input { display: none; }

        /* REVEAL AREA */
        #container { position: relative; flex-grow: 1; width: 100vw; display: flex; justify-content: center; align-items: center; }
        #legend { position: absolute; max-width: 95%; max-height: 95%; object-fit: contain; z-index: 1; filter: contrast(1.1); }
        
        /* GRID */
        #grid { 
            position: absolute; width: 100%; height: 100%; z-index: 2;
            display: grid; 
            grid-template-columns: repeat(160, 1fr); 
            grid-template-rows: repeat(156, 1fr); 
        }
        .box { background: #000; border: 0.1px solid #111; transition: opacity 0.5s ease; }
        
        /* GLOW POP ANIMATION */
        .revealed { 
            opacity: 0; 
            pointer-events: none; 
            animation: glowPop 0.6s ease-out; 
        }

        @keyframes glowPop {
            0% { background: var(--cyan); opacity: 1; box-shadow: 0 0 15px var(--cyan); }
            50% { background: var(--purple); opacity: 0.8; box-shadow: 0 0 30px var(--purple); }
            100% { background: transparent; opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="ui">
        <label class="btn" for="file-input">Upload Legend</label>
        <input type="file" id="file-input" accept="image/*">
        
        <input type="number" id="reveal-num" placeholder="00000">
        <button class="btn" onclick="executeReveal()">Execute Reveal</button>
        <button class="btn" onclick="resetGrid()" style="border-color:#ff0055; color:#ff0055;">Reset</button>
    </div>

    <div id="container">
        <img id="legend" src="">
        <div id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const img = document.getElementById('legend');
        const fileInput = document.getElementById('file-input');
        const boxes = [];
        const totalBoxes = 24960;

        function initGrid() {
            grid.innerHTML = '';
            boxes.length = 0;
            for (let i = 0; i < totalBoxes; i++) {
                const b = document.createElement('div');
                b.className = 'box';
                grid.appendChild(b);
                boxes.push(b);
            }
            for (let i = boxes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boxes[i], boxes[j]] = [boxes[j], boxes[i]];
            }
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    img.src = event.target.result;
                    resetGrid();
                }
                reader.readAsDataURL(file);
            }
        });

        function executeReveal() {
            const numToReveal = parseInt(document.getElementById('reveal-num').value);
            if (isNaN(numToReveal)) return;
            let count = 0;
            for (let i = 0; i < boxes.length && count < numToReveal; i++) {
                if (!boxes[i].classList.contains('revealed')) {
                    boxes[i].classList.add('revealed');
                    count++;
                }
            }
        }

        function resetGrid() { initGrid(); }
        initGrid();
    </script>
</body>
</html>
