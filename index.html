<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGEND REVEAL SYSTEM</title>
    <style>
        :root { --neon: #0f0; --bg: #000; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* UI HEADER */
        #ui { background: rgba(0, 0, 0, 0.9); padding: 15px; border-bottom: 2px solid var(--neon); z-index: 100; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
        input[type="number"] { background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 8px; width: 100px; font-size: 16px; outline: none; }
        .btn { background: var(--neon); color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn:active { background: #fff; }
        #file-input { display: none; }

        /* REVEAL AREA */
        #container { position: relative; flex-grow: 1; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #050505; }
        #legend { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; z-index: 1; display: none; }
        
        /* GRID SYSTEM (25,000 Boxes) */
        #grid { 
            position: absolute; width: 100%; height: 100%; z-index: 2;
            display: grid; 
            grid-template-columns: repeat(160, 1fr); 
            grid-template-rows: repeat(156, 1fr); 
        }
        .box { background: #000; border: 0.1px solid #111; transition: opacity 0.4s ease; }
        .revealed { opacity: 0; pointer-events: none; }
        
        /* CINEMATIC FLASH */
        .flash { animation: blink 0.2s 2; }
        @keyframes blink { 0% { background: #fff; } 100% { background: transparent; } }
    </style>
</head>
<body>

    <div id="ui">
        <label class="btn" for="file-input">Upload Legend</label>
        <input type="file" id="file-input" accept="image/*">
        
        <input type="number" id="reveal-num" placeholder="Followers">
        <button class="btn" onclick="executeReveal()">Execute</button>
        <button class="btn" onclick="resetGrid()" style="background:#f00; color:#fff;">Reset</button>
    </div>

    <div id="container">
        <img id="legend" src="">
        <div id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const img = document.getElementById('legend');
        const fileInput = document.getElementById('file-input');
        const boxes = [];
        const totalBoxes = 24960; // 160x156

        // 1. Initialize Grid
        function initGrid() {
            grid.innerHTML = '';
            boxes.length = 0;
            for (let i = 0; i < totalBoxes; i++) {
                const b = document.createElement('div');
                b.className = 'box';
                grid.appendChild(b);
                boxes.push(b);
            }
            // Shuffle for random reveal
            for (let i = boxes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [boxes[i], boxes[j]] = [boxes[j], boxes[i]];
            }
        }

        // 2. Handle Image Upload
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    img.src = event.target.result;
                    img.style.display = 'block';
                    resetGrid();
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Reveal Logic
        function executeReveal() {
            const numToReveal = parseInt(document.getElementById('reveal-num').value);
            if (isNaN(numToReveal)) return;

            let count = 0;
            for (let i = 0; i < boxes.length && count < numToReveal; i++) {
                if (!boxes[i].classList.contains('revealed')) {
                    boxes[i].classList.add('revealed', 'flash');
                    count++;
                }
            }
        }

        function resetGrid() {
            initGrid();
        }

        initGrid();
    </script>
</body>
</html>
